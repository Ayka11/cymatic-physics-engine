name: CPE v7.15 release validation and staging

on:
  push:
    branches: [full-app-v7.15]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [full-app-v7.15]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpe-v715-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full application validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release branch with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU-only Torch, declared dependencies, and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch==2.10.0+cpu" "torchaudio==2.10.0+cpu"
          python -m pip install --prefer-binary -r requirements.txt 'pytest>=8,<9'
          python -m pip check
          python -c "import gradio; assert gradio.__version__ == '5.50.0', gradio.__version__; print('Gradio', gradio.__version__)"
      - name: Compile Python sources
        run: python -m compileall -q app cymatic_engine cpe_hfr02 tests
      - name: Run full test suite
        run: python -m pytest -q
      - name: Construct and serve Gradio app smoke test
        run: |
          python - <<'PY'
          import importlib.util
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen

          entrypoint_path = Path("app.py")
          spec = importlib.util.spec_from_file_location("cpe_v715_entrypoint", entrypoint_path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"Cannot load entry point: {entrypoint_path}")

          entrypoint = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(entrypoint)

          demo = getattr(entrypoint, "demo", None)
          assert demo is not None, "Root app.py did not construct a Gradio demo"
          assert callable(getattr(demo, "launch", None)), "Gradio demo has no callable launch method"

          try:
              demo.launch(
                  server_name="127.0.0.1",
                  server_port=7860,
                  quiet=True,
                  prevent_thread_lock=True,
                  show_error=True,
              )
              last_error = None
              for _ in range(30):
                  try:
                      with urlopen("http://127.0.0.1:7860/", timeout=2) as response:
                          assert response.status == 200, f"Unexpected HTTP status: {response.status}"
                          html = response.read(4096).decode("utf-8", errors="replace")
                          assert "<html" in html.lower(), "Gradio root response was not HTML"
                          print("CPE v7.15 app construction and HTTP smoke test PASS")
                          break
                  except (URLError, TimeoutError, OSError) as exc:
                      last_error = exc
                      time.sleep(1)
              else:
                  raise RuntimeError(f"Gradio app did not serve HTTP successfully: {last_error}")
          finally:
              close = getattr(demo, "close", None)
              if callable(close):
                  close()
          PY

  deploy-staging:
    name: Optional deploy to isolated Hugging Face staging Space
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/full-app-v7.15'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Push to staging Space only when staging secrets exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_STAGING_SPACE: ${{ vars.HF_STAGING_SPACE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" || -z "${HF_STAGING_SPACE}" ]]; then
            echo "Staging deploy skipped: configure HF_TOKEN and HF_STAGING_SPACE."
            exit 0
          fi
          if [[ "${HF_STAGING_SPACE}" == "Aygun1489/cymatic-physics-engine" ]]; then
            echo "Refusing to deploy this workflow to the production Space."
            exit 1
          fi
          git lfs install
          git remote add hf-staging "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_STAGING_SPACE}"
          git push hf-staging "HEAD:refs/heads/main"
